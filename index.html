<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPL Prediction League - Submit Picks</title>
  <style>
    :root {
      --primary: #38003c;
      --accent: #00ff85;
      --bg: #f4f4f9;
      --card-bg: #ffffff;
      --text: #242424;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: var(--primary);
      text-align: center;
      margin-top: 0;
      font-size: 1.6rem;
    }

    p.subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    .instructions {
      font-size: 0.85rem;
      background: #eef2f5;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      color: #444;
    }

    #teamList {
      list-style-type: none;
      padding: 0;
      margin: 0 0 20px 0;
    }

    #teamList li {
      background: #fff;
      border: 1px solid #e0e0e0;
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: grab;
      display: flex;
      align-items: center;
      font-weight: 500;
      transition: background-color 0.2s, box-shadow 0.2s;
      user-select: none;
    }

    #teamList li:active {
      cursor: grabbing;
    }

    #teamList li.dragging {
      opacity: 0.5;
      background: #e8f5e9;
    }

    .rank-num {
      width: 28px;
      height: 28px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      margin-right: 12px;
      flex-shrink: 0;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #520058;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #cutoffBanner {
      display: none;
      background-color: #f8d7da;
      color: #721c24;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>EPL Predictions</h1>
    <p class="subtitle">Drag & drop teams to rank them 1 to 20</p>

    <div id="cutoffBanner">
      🔒 Submissions are officially closed for the season!
    </div>

    <form id="predictionForm" onsubmit="event.preventDefault(); submitPredictions();">
      <div class="form-group">
        <label for="playerName">Your Name / Username:</label>
        <input type="text" id="playerName" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="leaguePassword">League Password:</label>
        <input type="password" id="leaguePassword" placeholder="Enter password" required>
      </div>

      <div class="instructions">
        💡 <strong>How to rank:</strong> Click and drag any team up or down to adjust your predicted order. #1 is Champion, #20 is Relegated.
      </div>

      <ul id="teamList"></ul>

      <button type="submit" id="submitBtn">Submit Predictions</button>
    </form>
  </div>

  <script>
    // 1. Exact 20 Premier League Teams
    const defaultTeams = [
      "AFC Bournemouth",
      "Arsenal FC",
      "Aston Villa FC",
      "Brentford FC",
      "Brighton & Hove Albion FC",
      "Chelsea FC",
      "Coventry City FC",
      "Crystal Palace FC",
      "Everton FC",
      "Fulham FC",
      "Hull City AFC",
      "Ipswich Town FC",
      "Leeds United FC",
      "Liverpool FC",
      "Manchester City FC",
      "Manchester United FC",
      "Newcastle United FC",
      "Nottingham Forest FC",
      "Sunderland AFC",
      "Tottenham Hotspur FC"
    ];

    // Kickoff Cutoff Enforcement (UTC format)
    const KICKOFF_TIME = new Date("2026-08-15T11:30:00Z");

    // Initialize list and drag events
    document.addEventListener("DOMContentLoaded", () => {
      renderTeamList();
      checkKickoffCutoff();
    });

    function renderTeamList() {
      const list = document.getElementById("teamList");
      list.innerHTML = "";

      defaultTeams.forEach((teamName, index) => {
        const li = document.createElement("li");
        li.draggable = true;
        li.innerHTML = `<span class="rank-num">${index + 1}</span><span class="team-name">${teamName}</span>`;
        
        addDragEvents(li);
        list.appendChild(li);
      });
    }

    function updateRankNumbers() {
      const items = document.querySelectorAll("#teamList li");
      items.forEach((li, idx) => {
        li.querySelector(".rank-num").innerText = idx + 1;
      });
    }

    // Drag and Drop Logic
    let draggedItem = null;

    function addDragEvents(item) {
      item.addEventListener("dragstart", (e) => {
        draggedItem = item;
        setTimeout(() => item.classList.add("dragging"), 0);
      });

      item.addEventListener("dragend", () => {
        draggedItem.classList.remove("dragging");
        draggedItem = null;
        updateRankNumbers();
      });

      item.addEventListener("dragover", (e) => {
        e.preventDefault();
        const list = document.getElementById("teamList");
        const afterElement = getDragAfterElement(list, e.clientY);
        if (afterElement == null) {
          list.appendChild(draggedItem);
        } else {
          list.insertBefore(draggedItem, afterElement);
        }
      });
    }

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll("#teamList li:not(.dragging)")];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // Check cutoff time
    function checkKickoffCutoff() {
      const now = new Date();
      const submitBtn = document.getElementById("submitBtn");
      const cutoffBanner = document.getElementById("cutoffBanner");

      if (now >= KICKOFF_TIME) {
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerText = "Submissions Closed";
        }
        if (cutoffBanner) {
          cutoffBanner.style.display = "block";
        }
      }
    }

    // Form Submission
    async function submitPredictions() {
      const playerNameInput = document.getElementById("playerName");
      const passwordInput = document.getElementById("leaguePassword");
      const submitBtn = document.getElementById("submitBtn");

      const playerName = playerNameInput ? playerNameInput.value.trim() : "";
      const password = passwordInput ? passwordInput.value.trim() : "";

      if (!playerName) {
        alert("Please enter your name.");
        return;
      }

      // Replace with your actual league password
      if (password !== "YOUR_LEAGUE_PASSWORD") {
        alert("Incorrect league password!");
        return;
      }

      // Collect team order from list
      const teamElements = document.querySelectorAll("#teamList .team-name");
      const predictions = Array.from(teamElements).map(el => el.innerText.trim());

      if (predictions.length !== 20) {
        alert("Error: All 20 teams must be present.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      // Replace with your Web App URL from Apps Script
      const scriptURL = "https://script.google.com/macros/s/AKfycbxXPa3hnjxvnGREK_7mTZfjtC5brUFSFhKKAumzj5L0BY79Pkjt4TcyXQF1maNScIipug/exec";

      try {
        await fetch(scriptURL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            playerName: playerName,
            submissionType: "Pre-Season",
            predictions: predictions
          })
        });

        alert("Predictions submitted successfully!");
        window.location.reload();

      } catch (err) {
        console.error("Submission error:", err);
        alert("An error occurred during submission. Please try again.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Predictions";
      }
    }
  </script>
</body>
</html>
